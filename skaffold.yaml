apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: hateable-app

# ── Build ──────────────────────────────────────────
build:
  local:
    push: false # build locally and don't push to any registry
  artifacts:
    - image: auth-image
      context: authService
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'server.ts'
            dest: /app
          - src: 'src/**/*.ts'
            dest: /app

    - image: project-image
      context: projectService
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'server.ts'
            dest: /app
          - src: 'src/**/*.ts'
            dest: /app

    - image: ai-image
      context: aiService
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'server.ts'
            dest: /app
          - src: 'src/**/*.ts'
            dest: /app
          # agent system prompts: edit aiService/prompts/*.md, the next run picks them up
          - src: 'prompts/**/*.md'
            dest: /app

    - image: next-image-js
      context: boilerplates/nextjsboilerplatejs
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'app/**/*.{js,jsx,ts,tsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% next-image-js:latest']

    - image: next-image-ts
      context: boilerplates/nextjsboilerplatets
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.{js,jsx,ts,tsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% next-image-ts:latest']

    - image: node-image-js
      context: boilerplates/nodejsboilerplatejs
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.js'
            dest: /app
          - src: 'server.js'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% node-image-js:latest']

    - image: node-image-ts
      context: boilerplates/nodejsboilerplatets
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: /app
          - src: 'server.ts'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% node-image-ts:latest']

    - image: react-image-js
      context: boilerplates/reactjsboilerplatejs
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.{js,jsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% react-image-js:latest']

    - image: react-image-ts
      context: boilerplates/reactjsboilerplatets
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.{js,jsx,ts,tsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% react-image-ts:latest']

    - image: mern-image-js-client
      context: boilerplates/mernboilerplatejs/client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.{js,jsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% mern-image-js-client:latest']

    - image: mern-image-js-server
      context: boilerplates/mernboilerplatejs/server
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.js'
            dest: /app
          - src: 'server.js'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% mern-image-js-server:latest']

    - image: mern-image-ts-client
      context: boilerplates/mernboilerplatets/client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.{js,jsx,ts,tsx,css}'
            dest: /app
          - src: 'public/**/*'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% mern-image-ts-client:latest']

    - image: mern-image-ts-server
      context: boilerplates/mernboilerplatets/server
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: /app
          - src: 'server.ts'
            dest: /app
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% mern-image-ts-server:latest']

    - image: express-image
      context: express-file-server
      # no sync: skaffold never deploys this image itself (projectService creates the pods),
      # so a sync has no container to copy into; a rebuild + :latest tag is what reaches new pods
      docker:
        dockerfile: dockerfile
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% express-image:latest']

    - image: sync-image
      context: syncService
      # no sync: skaffold never deploys this image itself (projectService creates the pods),
      # so a sync has no container to copy into; a rebuild + :latest tag is what reaches new pods
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command: ['cmd.exe', '/c', 'docker tag %SKAFFOLD_IMAGE% sync-image:latest']

# ── Manifests ──────────────────────────────────────
manifests:
  # Prerequisite (once per cluster, kept out of skaffold so data survives): kubectl apply -f k8s/dev-storage.yml
  rawYaml:
    - k8s/secrets.yml
    - k8s/rbac.yml
    - k8s/redis-deployment.yml
    - k8s/redis-service.yml
    - k8s/mongo-deployment.yml
    - k8s/mongo-service.yml
    - k8s/s3-deployment.yml
    - k8s/s3-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/project-deployment.yml
    - k8s/project-service.yml
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/playwright-mcp-deployment.yml
    - k8s/playwright-mcp-service.yml
    - k8s/user-code-netpolicy.yml
    - k8s/ingress.yml

# ── Port Forwarding ────────────────────────────────
portForward:
  # Ingress on a dedicated port: on Windows, :80 is shared by Docker and the WSL relay and
  # requests land on either at random. The frontend dev server proxies to this port.
  - resourceType: service
    resourceName: ingress-nginx-controller
    namespace: ingress-nginx
    port: 80
    localPort: 8088
  - resourceType: service
    resourceName: auth-service
    port: 80
    localPort: 4000
  - resourceType: service
    resourceName: project-service
    port: 80
    localPort: 3000
  - resourceType: service
    resourceName: ai-service
    port: 80
    localPort: 5000
