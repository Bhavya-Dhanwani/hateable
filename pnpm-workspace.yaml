packages:
  - 'aiService'
  - 'authService'
  - 'express-file-server'
  - 'projectService'
  - 'syncService'
  - 'frontend'
  - 'boilerplates/**'
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  esbuild: true
  unrs-resolver: true
overrides:
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  compression@<1.8.2: ^1.8.2
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  handlebars@>=3.0.0 <=4.7.9: ^4.7.10
  next@>=16.0.0 <16.3.8: ^16.3.8
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  sharp@<0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=8.0.0 <8.10.2: ^8.10.2
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS: no patched release exists (3.0.3 is latest).
    # Only reachable via dev tooling (lint-staged, secretlint, nodemon); remove once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
