apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    name: ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - image: ai-image
          name: ai-main
          imagePullPolicy: IfNotPresent
          # tsx watch + LangGraph + the MCP client idle near 250M; agent runs hold many files in memory
          resources:
            requests:
              cpu: '120m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '768Mi'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          env:
            - name: NODE_ENV
              value: 'development'
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: AI_DB
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: message-broker
                  key: message-broker_url
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: ACCESS_TOKEN_SECRET
            - name: REDIS_HOST
              value: redis-service
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai
                  key: MISTRAL_API_KEY
            - name: MISTRAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ai
                  key: MISTRAL_API_KEYS
            - name: AGENT_SYSTEM_V2
              value: 'true'
            # browser QA through Playwright MCP (k8s/playwright-mcp-*.yml), remove to disable
            - name: PLAYWRIGHT_MCP_URL
              value: 'http://playwright-mcp-service:8931/mcp'
            # images for generated sites; both optional, missing keys fall back to placeholders
            - name: UNSPLASH_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai
                  key: UNSPLASH_ACCESS_KEY
                  optional: true
            - name: REPLICATE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai
                  key: REPLICATE_API_TOKEN
                  optional: true
            - name: PORT
              value: '5000'
          ports:
            - containerPort: 5000
              name: http
