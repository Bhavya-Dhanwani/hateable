apiVersion: apps/v1
kind: Deployment
metadata:
  name:  project-deployment
  labels:
    name: project-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  project
  template:
    metadata:
      labels:
        app:  project
    spec:
      serviceAccount:  resource-manager
      containers:
      - image:  project-image
        name:  project-main
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "120m"
            memory: "120M"
          limits:
            cpu: "250m"
            memory: "250M"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name:  auth
              key:  ACCESS_TOKEN_SECRET
        - name:  MONGO_URI
          valueFrom:
            secretKeyRef:
              name:  database
              key:  PROJECT_DB
        - name:  REDIS_URL
          value:  "redis://redis-service:6379"
        - name:  PORT
          value:  "3000"
        ports:
        - containerPort:  3000
          name:  http