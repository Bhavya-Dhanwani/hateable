apiVersion: apps/v1
kind: Deployment
metadata:
  name:  project-deployment
  labels:
    name: project-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  project
  template:
    metadata:
      labels:
        app:  project
    spec:
      containers:
      - image:  project-image
        name:  project-main
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "120m"
            memory: "120M"
          limits:
            cpu: "250m"
            memory: "250M"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name:  auth
              key:  ACCESS_TOKEN_SECRET
        - name:  MONGODB_URI
          valueFrom:
            secretKeyRef:
              name:  database
              key:  PROJECT_DB
        ports:
        - containerPort:  3000
          name:  http