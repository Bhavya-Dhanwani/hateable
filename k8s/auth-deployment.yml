apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    name: auth-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: auth-image
          name: auth-main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: '120m'
              memory: '120M'
            limits:
              cpu: '250m'
              memory: '250M'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          env:
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: ACCESS_TOKEN_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: REFRESH_TOKEN_SECRET
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: ADMIN_API_KEY
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: SMTP_PASS
                  optional: true
            - name: SEND_MAIL
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: SEND_MAIL
                  optional: true
            # Google login comes back through the ingress, then lands on the frontend dev server
            - name: GOOGLE_REDIRECT_URI
              value: http://localhost/api/auth/google/callback
            - name: FRONTEND_URL
              value: http://localhost:5173
            - name: TRUECALLER_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: TRUECALLER_APP_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_BOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: TELEGRAM_BOT_USERNAME
                  optional: true
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: TELEGRAM_WEBHOOK_SECRET
                  optional: true
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: AUTH_DB
            - name: ACCESS_TOKEN_EXPIRY
              value: 15m
            - name: REFRESH_TOKEN_EXPIRY
              value: 7d
            - name: PORT
              value: '4000'
          ports:
            - containerPort: 4000
              name: http
