apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-manager-role

# pods/exec: the workspace terminal; pods/log: the dev and deployment log views
rules:
  - apiGroups: ['']
    resources: ['pods', 'services']
    verbs: ['get', 'list', 'watch', 'create', 'delete']
  - apiGroups: ['']
    resources: ['pods/exec']
    verbs: ['create', 'get']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-manager-binding
subjects:
  - kind: ServiceAccount
    name: resource-manager
    namespace: default
roleRef:
  kind: ClusterRole
  name: resource-manager-role
  apiGroup: rbac.authorization.k8s.io
