apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watermelon
  labels:
    app.kubernetes.io/name: watermelon
spec:
  ingressClassName: nginx
  rules:
    - host: '*.preview.localhost'
      http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: project-service
                port:
                  number: 80

    # one-click deployments: <slug>.hateable.localhost (prod: *.hateable.bhavyadhanwani.dev, keep in sync with DEPLOY_DOMAIN)
    - host: '*.hateable.localhost'
      http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: project-service
                port:
                  number: 80

    - host: '*.workspace.localhost'
      http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: project-service
                port:
                  number: 80

    # the hateable API, on the app's own host only (prod: hateable.bhavyadhanwani.dev). Host-less API
    # rules would also match custom domains, so www.shop.com/api/auth/login would reach hateable's
    # auth service instead of the user's site.
    - host: 'localhost'
      http:
        paths:
          - pathType: Prefix
            path: '/api/auth'
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - pathType: Prefix
            path: '/api/projects'
            backend:
              service:
                name: project-service
                port:
                  number: 80
          - pathType: Prefix
            path: '/api/ai'
            backend:
              service:
                name: ai-service
                port:
                  number: 80

    # every other host: custom domains of deployments (projectService maps them to their site)
    - http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: project-service
                port:
                  number: 80
